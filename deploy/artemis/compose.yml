services:
  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    mem_limit: 96m
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@client-manager_db_1:5432/menkeu
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    ports:
      - "127.0.0.1:3002:3000"
    networks: [supabase]

  storage:
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    mem_limit: 160m
    depends_on:
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@client-manager_db_1:5432/menkeu
      STORAGE_PUBLIC_URL: ${PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: menkeu
      TENANT_ID: menkeu
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ./data/storage:/var/lib/storage
    ports:
      - "127.0.0.1:5001:5000"
    networks: [supabase]

networks:
  supabase:
    external: true
    name: client-manager_backend
